      <circle cx="0" cy="20" r="95" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4 12" opacity="0.4"/>
      <circle cx="0" cy="20" r="145" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="1 6" opacity="0.15">
