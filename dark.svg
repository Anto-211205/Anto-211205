<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Anto - AI Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.5" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.85" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brainGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="microGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#22D3EE" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <clipPath id="frameClip">
      <rect x="16" y="16" width="1148" height="578" rx="22"/>
    </clipPath>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Human Side Profile Silhouette Definition -->
    <path id="headSilhouette" d="
      M -15,-110 
      C 20,-115 50,-85 55,-50 
      C 53,-43 46,-38 43,-35 
      L 68,-12 
      C 68,-9 60,-2 50,-2 
      L 57,5 
      L 47,12 
      L 54,23 
      C 54,35 40,45 28,48 
      L 26,70 
      C 26,100 50,130 85,155 
      L -95,155 
      C -60,125 -50,95 -50,70 
      C -50,35 -75,-5 -65,-50 
      C -55,-90 -35,-110 -15,-110 
      Z" 
    />
    <clipPath id="headClip">
      <use href="#headSilhouette"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" fill="#000000"/>
