<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Anto - AI Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.5" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.85" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="dotMatrix" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.75" fill="#22D3EE" opacity="0.3"/>
    </pattern>
    <clipPath id="frameClip">
      <rect x="16" y="16" width="1148" height="578" rx="22"/>
    </clipPath>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Exact Silhouette Clip Path for Matrix Fill -->
    <path id="humanSilhouette" d="
      M -65,-40 
      C -70,-80 -45,-115 -15,-120 
      C 15,-125 50,-112 65,-85 
      C 72,-68 68,-50 62,-40 
      C 66,-25 68,-5 58,12 
      C 54,20 50,22 48,20 
      C 48,45 32,65 0,72 
      C -32,65 -48,45 -48,20 
      C -50,22 -54,20 -58,12 
      C -68,-5 -66,-25 -62,-40 Z
      M -30,72 L -32,92 L -85,115 L -135,145 L 135,145 L 85,115 L 32,92 L 30,72 Z"
    />
    <clipPath id="portraitClip">
      <use href="#humanSilhouette"/>
    </clipPath>
  </defs>

