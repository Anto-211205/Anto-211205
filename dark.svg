    <rect x="16" y="16" width="1148" height="578" fill="url(#grid)"/>
    <rect x="16" y="16" width="1148" height="578" fill="url(#glowV)"/>
    <rect x="16" y="16" width="1148" height="578" fill="url(#glowC)"/>

    <!-- Floating Particles -->
    <g fill="#22D3EE" opacity="0.5">
      <circle cx="200" cy="120" r="1.2"><animate attributeName="cy" values="120;540;120" dur="22s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="300" r="1"><animate attributeName="cy" values="300;80;300" dur="26s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="200" r="1.4"><animate attributeName="cy" values="200;500;200" dur="30s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="400" r="1"><animate attributeName="cy" values="400;120;400" dur="24s" repeatCount="indefinite"/></circle>
    </g>
  </g>

