        <!-- Data Nodes -->
        <circle cx="25" cy="-75" r="3" fill="#7C3AED"/>
        <circle cx="45" cy="-60" r="2" fill="#22D3EE"/>
        <circle cx="30" cy="-30" r="3" fill="#7C3AED"/>
