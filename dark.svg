        <circle cx="-15" cy="-35" r="25" fill="#22D3EE" opacity="0.15" filter="url(#softGlow)"/>

        <!-- Neural Network Lines -->
        <path d="M -15,-35 L 25,-75 L 45,-60 
                 M -15,-35 L 30,-30 L 45,-30 
